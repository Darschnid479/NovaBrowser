name: Bug report
description: Report something that is broken in NOVA
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve NOVA. Remove personal information from logs before posting."
  - type: input
    id: version
    attributes:
      label: NOVA version or commit
      placeholder: "0.2.0 or commit hash"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: "Describe the problem clearly."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open NOVA
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: "Remove usernames, URLs, tokens, and personal information first."
      render: text
