name: Feil i NOVA
description: Rapporter et problem som kan gjenskapes.
title: "[Feil]: "
body:
  - type: markdown
    attributes:
      value: "Ikke legg ved passord, tokens, WebView2-profil eller private logger. For sikkerhetsfeil, les SECURITY.md."
  - type: input
    id: version
    attributes:
      label: NOVA-versjon eller commit
      placeholder: "0.2.0 / commit-ID"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows-versjon og skjermskalering
      placeholder: "Windows-versjon, 100/125/150/200 prosent"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Hvordan gjenskapes problemet?
      description: "Beskriv hva du klikket eller skrev, i riktig rekkefølge."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Forventet og faktisk oppførsel
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant skjermbilde eller redigert feilmelding
      description: "Fjern persondata. Fortell om bildet er fra appen eller en designforhåndsvisning."
  - type: checkboxes
    id: privacy
    attributes:
      label: Personvern
      options:
        - label: "Jeg har kontrollert at vedleggene ikke inneholder hemmeligheter eller privat nettleserdata."
          required: true
