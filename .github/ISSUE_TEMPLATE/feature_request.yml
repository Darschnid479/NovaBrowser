name: Feature request
description: Suggest a new NOVA feature or UX improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "Describe the user problem first."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      placeholder: "How should NOVA behave?"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Extra context
      placeholder: "Mockups, examples, trade-offs, or alternatives."
