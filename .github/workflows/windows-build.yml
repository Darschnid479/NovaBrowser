name: Build NOVA on Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check URL policy and state model
        run: dotnet run --project tests/NovaBrowser.Checks/NovaBrowser.Checks.vbproj -c Release
      - name: Render vector icons and check address layout (WPF)
        run: dotnet run --project tests/NovaBrowser.UiChecks/NovaBrowser.UiChecks.vbproj -c Release
      - name: Build WPF and VB.NET source
        run: dotnet build NOVA.sln -c Release
      - name: Publish Windows x64 folder
        run: dotnet publish src/NovaBrowser/NovaBrowser.vbproj -c Release -r win-x64 --self-contained true -o out/win-x64 -p:PublishSingleFile=false
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-win-x64
          path: out/win-x64/
          if-no-files-found: error
