name: Build NOVA on Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  DOTNET_NOLOGO: '1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Source assertions
        run: python tools/check_source.py
      - name: Package and local link checks
        run: python tools/check_package.py
      - name: Upload integration tests against disposable LOCAL remotes
        shell: powershell
        run: .\tests\Upload.Tests.ps1
      - name: URL policy and state model
        run: dotnet run --project tests/NovaBrowser.Checks/NovaBrowser.Checks.vbproj -c Release
      - name: WPF icon and text layout checks
        run: dotnet run --project tests/NovaBrowser.UiChecks/NovaBrowser.UiChecks.vbproj -c Release
      - name: Build WPF and VB.NET
        run: dotnet build NOVA.sln -c Release
      - name: Publish Windows x64 test folder
        run: dotnet publish src/NovaBrowser/NovaBrowser.vbproj -c Release -r win-x64 --self-contained true -o out/win-x64 -p:PublishSingleFile=false
      - uses: actions/upload-artifact@v7
        with:
          name: NOVA-win-x64-unsigned-test-build
          path: out/win-x64/
          if-no-files-found: error
          retention-days: 14
