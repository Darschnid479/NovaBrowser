name: Check NOVA package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Package and local resources
        run: python3 tools/check_package.py
      - name: VB/XAML source assertions (NOT a Windows build)
        run: python3 tools/check_source.py
      - name: JavaScript syntax
        run: |
          node --check docs/assets/site.js
          node --check docs/assets/preview.js
