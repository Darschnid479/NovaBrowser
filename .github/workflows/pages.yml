name: Publish NOVA website
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check whether Pages is configured for Actions
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>pages-status.txt) && [ "$mode" = workflow ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '### Website not deployed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Enable Settings > Pages > Source: GitHub Actions, then run this workflow again. If already enabled, inspect the API error below and retry.' >> "$GITHUB_STEP_SUMMARY"
            cat pages-status.txt
          fi
      - uses: actions/configure-pages@v5
        if: steps.ready.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.ready.outputs.enabled == 'true'
        with:
          path: docs
      - name: Deploy website
        id: deployment
        if: steps.ready.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
