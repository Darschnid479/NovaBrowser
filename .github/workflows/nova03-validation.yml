name: NOVA 0.3 development validation
on:
  push:
    branches: ['work/nova-0.3.0']
    paths: ['.github/workflows/nova03-validation.yml', 'engineering/run03.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova03-validation
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  DOTNET_NOLOGO: '1'
jobs:
  validate:
    if: github.repository == 'Darschnid479/NovaBrowser' && github.ref == 'refs/heads/work/nova-0.3.0'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Materialize proposed source in disposable checkout
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($script in @('apply03','refine03','lifecycle03','polish03')) {
            python "engineering/$script.py" 2>&1 | Tee-Object "artifacts/$script.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Static source and package checks
        run: |
          python tools/check_source.py 2>&1 | Tee-Object artifacts/source-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_package.py 2>&1 | Tee-Object artifacts/package-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload BAT integration against disposable LOCAL remotes
        shell: powershell
        run: |
          .\tests\Upload.Tests.ps1 2>&1 | Tee-Object artifacts/upload-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pure VB policies and profile recovery
        run: |
          dotnet run --project tests/NovaBrowser.Checks/NovaBrowser.Checks.vbproj -c Release 2>&1 | Tee-Object artifacts/policy-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WPF vector and text layout checks
        run: |
          dotnet run --project tests/NovaBrowser.UiChecks/NovaBrowser.UiChecks.vbproj -c Release 2>&1 | Tee-Object artifacts/layout-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile complete browser and integration tests
        run: |
          dotnet build NOVA.sln -c Release 2>&1 | Tee-Object artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real WPF window and WebView2 integration checks
        timeout-minutes: 8
        run: |
          dotnet run --project tests/NovaBrowser.ShellChecks/NovaBrowser.ShellChecks.vbproj -c Release --no-build -- artifacts/wpf --live 2>&1 | Tee-Object artifacts/shell-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish unsigned Windows x64 candidate
        id: publish
        run: |
          dotnet publish src/NovaBrowser/NovaBrowser.vbproj -c Release -r win-x64 --self-contained true -o out/win-x64 -p:PublishSingleFile=false 2>&1 | Tee-Object artifacts/publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Document observed results and real screenshots
        run: |
          python engineering/present03.py 2>&1 | Tee-Object artifacts/presentation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check docs/assets/site.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item docs/RELEASE-NOTES.md out/win-x64/RELEASE-NOTES.md
          Copy-Item LICENSE out/win-x64/LICENSE.txt
          @'
          NOVA 0.3.0 - WINDOWS X64 DEVELOPMENT PREVIEW
          Extract ALL files, keep the folder together, then open NOVA.exe.
          .NET is included. Microsoft WebView2 Runtime is required separately.
          This build is unsigned. It is not a stable or security-certified release.
          Close the old NOVA version before starting this one.
          Existing settings and bookmarks remain in %LOCALAPPDATA%\NOVA-Browser.
          Back up that folder locally while NOVA is closed. Do not upload it.
          Native window controls: close/minimize/maximize. Ctrl+J: downloads.
          Ctrl+K: commands. Ctrl+Shift+F: focus. Right-click tabs for tab tools.
          Source and test evidence: https://github.com/Darschnid479/NovaBrowser
          '@ | Set-Content out/win-x64/START-HER.txt -Encoding utf8NoBOM
          $root = (Resolve-Path out/win-x64).Path
          $hashes = Get-ChildItem $root -File -Recurse | Sort-Object FullName | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetRelativePath($root,$_.FullName).Replace('\','/')
          }
          $hashes | Set-Content out/win-x64/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Commit verified source to work/nova-0.3.0 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python engineering/seal03.py 2>&1 | Tee-Object artifacts/seal.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve proposed source and exact build metadata
        if: always()
        shell: python
        run: |
          import pathlib, zipfile, hashlib, json, os
          root=pathlib.Path('.')
          target=root/'artifacts'
          target.mkdir(exist_ok=True)
          excluded={'.git','bin','obj','out','artifacts','engineering','__pycache__'}
          paths=sorted(p for p in root.rglob('*') if p.is_file() and not any(part in excluded for part in p.parts) and p.name!='nova03-validation.yml')
          with zipfile.ZipFile(target/'candidate-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for path in paths: z.write(path, 'NOVA-0.3.0/'+path.as_posix())
          data={'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'files':{p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}}
          (target/'source-manifest.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NOVA03-validation-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always() && steps.publish.outcome == 'success'
        with:
          name: NOVA03-unsigned-win-x64
          path: out/win-x64/
          if-no-files-found: error
          retention-days: 14
